<!--/*Calcular el Promedio Anual del Sueldo de N Trabajadores. Este Promedio debe ser calculado 
considerando que al año tiene 12 Sueldos,  1 Escolaridad y 2 Aguinaldos. El Sueldo Base es 
de 1.650.000 si es técnico, 2.000.000 si es egresado de universidad, 2.400.000 si es titulado y 3.000.000
 tiene maestría. Además la escolaridad es de 500.000, los Aguinaldos son de 500.000.  
Además se sabe que al Trabajador se le descuenta el 10% por Seguro de Pensión,  el 5% de 
Seguro Social y el 12% por aporte a la Caja de Ahorro.  Es conveniente saber que si el número 
de trabajadores que ganan más de 2.000.000  es menor del 30% del total de trabajadores, se 
debe considerar darle a aquel trabajador un Bono Adicional del 15% de su Sueldo Promedio. 
Mostrar los nuevos Sueldos Promedio para los trabajadores con Bono adicional. -->
